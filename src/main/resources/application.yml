server:
  port: 8083
  
spring:
  application:
    name: ami-persistence-service
      
  cloud:
    function:
      definition: handleNewMeterData15min

    stream:
      kafka:
        binder:
          brokers: 192.168.196.130:9092          
          autoCreateTopics: true
          minPartitionCount: 2
          replicationFactor: 1
      
      bindings:
        handleNewMeterData15min-in-0:
          destination: ami.raw.15min
          group: csu.ami.raw.15min
          consumer:
            batch-mode: true          
          
  mongodb:
    uri: mongodb://192.168.196.130:2717/
    database: agg_meter_data_db
    autoIndexCreation: true